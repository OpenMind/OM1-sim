# DeepRobotics M20 (wheeled quadruped) — runtime configuration.
# Paths are relative to the isaac_sim/ directory unless absolute.
type: m20

# Policy checkpoint dir (expects exported/policy.pt + params/{env,deploy}.yaml)
policy_dir: checkpoints/m20_standstill

# Default robot prim path in the stage (overridable via --robot_root)
prim_root: /World/M20

# Base link prim under prim_root; used for sensor prim paths and /joint_states.
base_link_name: base_link

# Spawn height (z, metres). Training init_state stands the M20 at 0.52 m; a
# small margin lets it settle without a hard drop.
init_height: 0.55
apartment_height: 0.55

# Robot USD: bundled asset only (M20 has no Isaac Sim fallback).
usd_relative: assets/m20/usd/M20.usd
isaac_fallback_usd: null

enable_lidar: true

# 2D RPLIDAR off by default; /scan comes from the fused 3D clouds via the
# om_common cloud_to_scan node. Override per run with --scan_source 2d|3d
# (+ matching SCAN_SOURCE env on the sensor launch).
enable_2d_lidar: false

# Sensor mount positions (metres, relative to base_link) — drive both the
# simulated sensor placement and the published /tf_static tree.
sensors:
  camera_link: [0.3, 0.0, 0.12]
  lidar_l1: [0.3, 0.0, 0.10]
  velodyne: [0.25, 0.0, 0.15]

# 3D lidar units (replaces the single L1 lidar when set): one RTX lidar and
# base -> frame_id static TF per entry; merged into /utlidar/cloud_fused by
# the om_common point_cloud_fusion node.
lidars_3d:
  - name: front
    frame_id: lidar_front_link
    topic: /utlidar/front/cloud_raw
    position: [0.3, 0.0, 0.10]
    rpy_deg: [0.0, 0.0, 0.0]
  - name: back
    frame_id: lidar_back_link
    topic: /utlidar/back/cloud_raw
    position: [-0.3, 0.0, 0.10]
    rpy_deg: [0.0, 0.0, 180.0]
