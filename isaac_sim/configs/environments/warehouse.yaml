    positions: [[-12.0, -2.7, 0.80]]
  - name: MustardBottle
    usd_isaac_relative: /Isaac/Props/YCB/Axis_Aligned_Physics/006_mustard_bottle.usd
    dynamic: true
    positions: [[-11.6, -3.3, 0.80]]

  # Static floor clutter (south-west).
  - name: Pallet
    usd_isaac_relative: /Isaac/Props/Pallet/pallet.usd
    positions:
      - [-15.0, -11.0, 0.0]
      - [-14.0, -11.0, 0.0]
      - [-16.0, -14.0, 0.0]
  - name: KLTBin
