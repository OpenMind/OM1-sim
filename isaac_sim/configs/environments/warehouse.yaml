platforms:
  - name: Mezzanine
    center: [2.9, -20.4]
    top_z: 1.0
    size_xy: [5.0, 6.0]   # 30 m2 deck, room to turn around and park up top
    thickness: 0.1
    color: [0.85, 0.65, 0.13]
    concrete_color: [0.62, 0.62, 0.60]
    skirt:
      thickness: 0.2      # concrete walls, ground -> deck underside
    deck_walls:
      height: 0.7         # parapet round the deck, open where the ramp lands
      thickness: 0.15
    ramp:
      direction: "-x"
      run: 12.0
      width: 3.0
      fill: true
      walls:
        height: 0.6
        thickness: 0.12

remove_prims:
  - region: [-4.6, -1.2, 8.5, 15.0]
  - region: [-18.8, -5.2, 6.6, 8.4]
  - region: [-18.0, -16.5, -3.4, -0.8]
  - region: [1.6, 2.8, 0.4, 1.6]

agents:
  - name: Forklift1
    usd_isaac_relative: /Isaac/Props/Forklift/forklift.usd
    yaw_offset_deg: 90.0
    speed: 0.6
    turn_rate: 0.8
    pause: 2.0
    loop: true
    waypoints: [[3.0, 6.0], [3.0, -16.0], [-22.0, -16.0], [-22.0, 6.0]]

  - name: Forklift2
    usd_isaac_relative: /Isaac/Props/Forklift/forklift.usd
    yaw_offset_deg: 90.0
    speed: 0.5
    turn_rate: 0.8
    pause: 1.0
    loop: true
    waypoints: [[0.0, -15.0], [-8.0, -15.0], [-8.0, -12.0], [0.0, -12.0]]

  - name: Dolly1
    usd_isaac_relative: /Isaac/Props/Dolly/dolly.usd
    speed: 0.4
    turn_rate: 1.2
    pause: 1.5
    loop: false
    waypoints: [[-7.0, 3.0], [-7.0, -9.0]]

people:
  loop: inf
  dynamic_avoidance_enabled: true
  navmesh_enabled: false
  stop_distance: 1.2
  collider:
    enabled: true
    radius: 0.3
    height: 1.8
  characters:
    - name: Worker1
      usd_isaac_relative: /Isaac/People/Characters/male_adult_construction_01_new/male_adult_construction_01_new.usd
      position: [-1.0, 3.0, 0.0]
      yaw_deg: -90.0
      commands:
        - GoTo -1.0 -9.0 0 _
        - Idle 2
        - GoTo -1.0 3.0 0 _
        - Idle 2

    # Loops near the robot spawn (close-interaction case).
    - name: Worker2
      usd_isaac_relative: /Isaac/People/Characters/F_Business_02/F_Business_02.usd
      position: [1.5, 3.0, 0.0]
      commands:
        - GoTo 1.5 -4.0 0 _
        - GoTo -4.0 -4.0 0 _
        - Idle 3
        - GoTo -4.0 3.0 0 _
        - GoTo 1.5 3.0 0 _

    - name: Worker3
      usd_isaac_relative: /Isaac/People/Characters/male_adult_construction_05_new/male_adult_construction_05_new.usd
      position: [-5.5, 3.0, 0.0]
      commands:
        - GoTo -5.5 -9.0 0 _
        - Idle 2
        - GoTo -5.5 3.0 0 _
        - Idle 2

# Analog pressure gauges
gauges:
  defaults:
    diameter: 0.16
    range: [0.0, 1.6]
    units: MPa
    mount: post

  items:
    - id: PG-001
      position: [2.2, 1.0, 0.9]
      yaw_deg: 180.0
      diameter: 0.25
      value: 0.95

    - id: PG-101
      position: [-17.0, 7.4, 1.10]
      yaw_deg: -90.0
      value: 0.62
      post_base_z: 0.66
    - id: PG-102
      position: [-15.2, 7.4, 1.10]
      yaw_deg: -90.0
      range: [0.0, 10.0]
      units: bar
