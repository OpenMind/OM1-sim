# Mezzanine for elevated-nav testing
platforms:
  - name: Mezzanine
    center: [2.9, -20.9]
    top_z: 1.0
    size_xy: [4.0, 4.0]
    thickness: 0.1
    color: [0.85, 0.65, 0.13]
    ramp:
      direction: "-x"
      run: 5.7        # slope = atan(top_z / run), ~10 deg; 14 deg made Go2 slip
      width: 1.6

remove_prims:
  - region: [-4.6, -1.2, 8.5, 15.0]

agents:
  - name: Forklift1
    usd_isaac_relative: /Isaac/Props/Forklift/forklift.usd
    yaw_offset_deg: 90.0
    speed: 0.6
    turn_rate: 0.8
    pause: 2.0
    loop: true
    waypoints: [[3.0, 6.0], [3.0, -16.0], [-22.0, -16.0], [-22.0, 6.0]]

  - name: Forklift2
    usd_isaac_relative: /Isaac/Props/Forklift/forklift.usd
    yaw_offset_deg: 90.0
    speed: 0.5
    turn_rate: 0.8
    pause: 1.0
    loop: true
    waypoints: [[0.0, -15.0], [-8.0, -15.0], [-8.0, -12.0], [0.0, -12.0]]

  - name: Dolly1
    usd_isaac_relative: /Isaac/Props/Dolly/dolly.usd
    speed: 0.4
    turn_rate: 1.2
    pause: 1.5
    loop: false
    waypoints: [[-7.0, 3.0], [-7.0, -9.0]]

people:
  loop: inf
  dynamic_avoidance_enabled: true
  navmesh_enabled: false
  stop_distance: 1.2
  collider:
    enabled: true
    radius: 0.3
    height: 1.8
  characters:
    - name: Worker1
      usd_isaac_relative: /Isaac/People/Characters/male_adult_construction_01_new/male_adult_construction_01_new.usd
      position: [-1.0, 3.0, 0.0]
      yaw_deg: -90.0
      commands:
        - GoTo -1.0 -9.0 0 _
        - Idle 2
        - GoTo -1.0 3.0 0 _
        - Idle 2

    # Loops near the robot spawn (close-interaction case).
    - name: Worker2
      usd_isaac_relative: /Isaac/People/Characters/F_Business_02/F_Business_02.usd
      position: [1.5, 3.0, 0.0]
      commands:
        - GoTo 1.5 -4.0 0 _
        - GoTo -4.0 -4.0 0 _
        - Idle 3
        - GoTo -4.0 3.0 0 _
        - GoTo 1.5 3.0 0 _

    - name: Worker3
      usd_isaac_relative: /Isaac/People/Characters/male_adult_construction_05_new/male_adult_construction_05_new.usd
      position: [-5.5, 3.0, 0.0]
      commands:
        - GoTo -5.5 -9.0 0 _
        - Idle 2
        - GoTo -5.5 3.0 0 _
        - Idle 2
