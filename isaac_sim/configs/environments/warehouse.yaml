      - [-15.0, -11.0, 0.15]
      - [-14.0, -11.0, 0.15]
  - name: Cabinet
    usd_isaac_relative: /Isaac/Props/Sektion_Cabinet/sektion_cabinet_instanceable.usd
    positions: [[-17.0, -7.0, 0.0]]
  - name: Conveyor
    usd_isaac_relative: /Isaac/Props/Conveyors/ConveyorBelt_A01.usd
    positions: [[-18.0, -4.0, 0.0]]
  - name: Barrel
    usd_isaac_relative: /Isaac/Environments/Simple_Warehouse/Props/SM_BarelPlastic_A_01.usd
    positions:
      - [-13.0, -13.0, 0.0]
